# Render the Quarto site and deploy directly through GitHub Pages.
# Unlike pushing with GITHUB_TOKEN to gh-pages, deploy-pages publishes immediately.
# GitHub Settings > Pages > Build and deployment > Source must be "GitHub Actions".
name: Build and publish academic website
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: academic-website-deployment
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
      - name: Install Quarto
        uses: quarto-dev/quarto-actions/setup@v2
      - name: Download high-resolution timeline logos
        run: |
          set -e
          mkdir -p images/timeline
          curl --fail --location --retry 3 --silent --show-error 'https://upload.wikimedia.org/wikipedia/commons/4/4d/University_of_Cambridge_logo.png' -o images/timeline/cambridge.png
          curl --fail --location --retry 3 --silent --show-error 'https://upload.wikimedia.org/wikipedia/commons/9/9f/TMU_logo.svg' -o images/timeline/tmu.svg
          curl --fail --location --retry 3 --silent --show-error 'https://logotyp.us/file/childrens-hospital-boston.svg' -o images/timeline/boston-childrens.svg
          test "$(wc -c < images/timeline/cambridge.png)" -gt 50000
          test "$(wc -c < images/timeline/tmu.svg)" -gt 2000
          test "$(wc -c < images/timeline/boston-childrens.svg)" -gt 1000
          file images/timeline/*
      - name: Render website
        run: quarto render
      - name: Include downloaded timeline images in website
        run: |
          mkdir -p _site/images/timeline
          cp -a images/timeline/. _site/images/timeline/
      # GitHub Pages will deploy the output in _site; do not edit _site manually.
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - name: Upload site to Pages
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
