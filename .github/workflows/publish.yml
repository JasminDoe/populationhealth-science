# Render the Quarto site and deploy directly through GitHub Pages.
# Unlike pushing with GITHUB_TOKEN to gh-pages, deploy-pages publishes immediately.
# GitHub Settings > Pages > Build and deployment > Source must be "GitHub Actions".
name: Build and publish academic website
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: academic-website-deployment
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
      - name: Install Quarto
        uses: quarto-dev/quarto-actions/setup@v2
      - name: Render website
        run: quarto render
      # GitHub Pages will deploy the output in _site; do not edit _site manually.
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - name: Upload site to Pages
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
